name: Deploy account pages

# The password-reset / email-confirmation fallback page and its Universal
# Link / App Link files, one Cloudflare Pages project per Supabase project —
# same reasoning as deploy-admin.yml, and the reason this exists as its own
# workflow rather than folding into deploy-web.yml: unlike the legal pages
# (always just whatever's current, no staging needed), this needed a real,
# independently-testable dev environment. See Milestone-5-Ship-It.md,
# "Corrections made during implementation" 6.
#
#   push to develop -> gigaway-account-dev  (account-dev.gigaway.app, talks to
#                                            the dev Supabase project)
#   push to main    -> gigaway-account      (account.gigaway.app, talks to
#                                            prod)
#
# Secrets (repo settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   shared with deploy-web.yml
#   SUPABASE_URL, SUPABASE_ANON_KEY               shared with keepalive.yml
#   SUPABASE_DEV_URL, SUPABASE_DEV_ANON_KEY       shared with keepalive.yml
# The Android SHA-256 fingerprints and Apple Team ID are hardcoded directly in
# build-account-web.mjs, not secrets — see that file's own comment for why.

on:
  push:
    branches: [develop, main]
    paths:
      - 'scripts/build-account-web.mjs'
      - 'scripts/publish-pages.mjs'
      - 'scripts/verify-account-deploy.mjs'
      - '.github/workflows/deploy-account.yml'
  workflow_dispatch: {}

jobs:
  deploy-dev:
    name: Deploy account pages (dev)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-account-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build account pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: pnpm build:account-web

      - name: Publish to Cloudflare Pages
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-pages.mjs site-account-dev gigaway-account-dev --create

      - name: Verify the deployment
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-account-deploy.mjs "$DEPLOY_URL"

  deploy-prod:
    name: Deploy account pages (prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-account-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build account pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: pnpm build:account-web

      - name: Publish to Cloudflare Pages
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-pages.mjs site-account gigaway-account --create

      - name: Verify the deployment
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-account-deploy.mjs "$DEPLOY_URL"
