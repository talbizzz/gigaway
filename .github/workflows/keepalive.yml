name: Keep Supabase awake

# Supabase pauses a free-tier project after ~7 days without API activity, and
# both GigAway projects are on the free tier.
#
# The pg_cron jobs in the schema do NOT prevent this: pg_cron runs inside
# Postgres and never touches the API layer, which is where activity is
# measured. Only a real HTTP request counts.
#
# Every 3 days rather than every 6, because GitHub's scheduler is best-effort
# and runs late under load — a seven-day window wants more than one chance to
# fire.
#
# NOTE: GitHub disables scheduled workflows in a repository with no commits for
# 60 days, so the ping stops exactly when it was needed. If a project pauses
# anyway, check the Actions tab first.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One project being down must not cancel the other's ping — that would
      # turn a single outage into two paused projects.
      fail-fast: false
      matrix:
        include:
          - project: production
            url_secret: SUPABASE_URL
            key_secret: SUPABASE_ANON_KEY
          - project: development
            url_secret: SUPABASE_DEV_URL
            key_secret: SUPABASE_DEV_ANON_KEY

    steps:
      - name: Ping PostgREST and Auth
        env:
          # GitHub allows a dynamic key into the secrets context, which is what
          # lets one job definition cover both projects.
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_ANON_KEY: ${{ secrets[matrix.key_secret] }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::${{ matrix.url_secret }} or ${{ matrix.key_secret }} is not set"
            exit 1
          fi

          ref="${SUPABASE_URL#https://}"; ref="${ref%%.supabase.co*}"
          echo "Project: ${PROJECT} (${ref})"

          # A real query through PostgREST into Postgres. cities is reference
          # data and readable without a session, so the anon key suffices.
          #
          # NOT the PostgREST root (/rest/v1/): Supabase restricts that to the
          # service_role key and answers the anon key with 401 "Only the
          # service_role API key can be used for this endpoint".
          #
          # --fail turns a 4xx/5xx into a failed job, so a broken ping is
          # visible rather than silently doing nothing.
          code=$(curl -sS --fail --max-time 30 \
            -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/cities?select=id&limit=1")
          echo "PostgREST: HTTP ${code}"

          # Auth is a separate service and pausing is per-project, but hitting
          # both costs nothing and covers a partial outage.
          code=$(curl -sS --fail --max-time 30 \
            -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")
          echo "Auth: HTTP ${code}"

          echo "${PROJECT} pinged — activity clock reset."
