name: Deploy website

# The legal pages are a hard dependency of both store listings: Play and
# App Store both refuse a submission without a live privacy policy URL.
on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'scripts/build-legal.mjs'
      - 'scripts/publish-pages.mjs'
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Render legal/*.md into site/
        run: pnpm build:legal

      # scripts/publish-pages.mjs runs wrangler through npx and always passes
      # `--branch main`. Without that flag wrangler files the deploy as a preview
      # and gigaway.app keeps serving the previous version while the run reports
      # success. (It replaced cloudflare/wrangler-action, whose `pnpm add wrangler`
      # at the workspace root pnpm refuses.)
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-pages.mjs site gigaway

      - name: Verify the pages are live
        run: |
          set -euo pipefail
          sleep 10
          for p in privacy terms guidelines impressum delete-account; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://gigaway.app/$p")
            echo "  /$p → $code"
            [ "$code" = "200" ] || { echo "::error::/$p returned $code"; exit 1; }
          done
