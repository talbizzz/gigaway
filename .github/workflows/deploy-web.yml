name: Deploy website

# The legal pages are a hard dependency of both store listings: Play and
# App Store both refuse a submission without a live privacy policy URL.
on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'scripts/build-legal.mjs'
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Render legal/*.md into site/
        run: pnpm build:legal

      # --branch main is load-bearing. Without it wrangler infers the branch
      # from git, files the deploy as a preview, and gigaway.app keeps serving
      # the previous version while the run reports success.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name gigaway --branch main

      - name: Verify the pages are live
        run: |
          set -euo pipefail
          sleep 10
          for p in privacy terms guidelines impressum delete-account; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://gigaway.app/$p")
            echo "  /$p → $code"
            [ "$code" = "200" ] || { echo "::error::/$p returned $code"; exit 1; }
          done
